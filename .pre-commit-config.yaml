repos:
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format --verify-no-changes
        entry: dotnet format --verify-no-changes --no-restore
        language: system
        files: \.cs$
        pass_filenames: false
      - id: gitleaks-protect
        name: gitleaks protect --staged
        entry: gitleaks protect --staged -c .gitleaks.toml
        language: system
        pass_filenames: false
