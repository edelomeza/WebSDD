name: ci-pr
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=true
      - run: dotnet test -c Release --no-build

  codeql:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto,.semgrep/semgrep.yaml

  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet list package --vulnerable --include-transitive

  secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  critic:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: critic guardrails
        shell: pwsh
        run: ./scripts/critic-guardrails.ps1
      - name: slnx check
        shell: pwsh
        run: ./scripts/check_slnx.ps1

  endpoints:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: endpoints check
        shell: pwsh
        run: ./scripts/check_endpoints.ps1

  sdd:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: sdd lint
        shell: pwsh
        run: ./scripts/check_sdd.ps1

  coverage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: coverage advisory
        run: python3 scripts/check_coverage.py

  delta-check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: delta coverage advisory
        run: python3 scripts/check_delta_coverage.py --min 80 --advisory

  stryker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # since:main requiere historial completo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: install stryker
        run: dotnet tool install -g dotnet-stryker
      - name: mutation advisory
        run: dotnet stryker --config-file stryker-config.json

  sonar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Informativo con guard a nivel de step: env no existe en jobs.<id>.if.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: sonar informativo
        if: "${{ env.SONAR_TOKEN != '' }}"
        run: 'echo "SonarCloud pendiente de alta de proyecto (deuda 003: cuerpo real al configurar)"'

  trivy-config:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif

  trivy-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -f WebSDD/Dockerfile -t websdd:ci .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: websdd:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: sbom cyclonedx
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: 'false'
      - name: upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  hadolint:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: hadolint dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: WebSDD/Dockerfile
          failure-threshold: error
