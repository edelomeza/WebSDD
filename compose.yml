services:
  webapp:
    build:
      context: .
      dockerfile: WebSDD/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiSettings__BaseUrl: http://mock-api:7227/
    depends_on:
      mock-api:
        condition: service_healthy
    volumes:
      - dpkeys:/var/dpkeys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mock-api:
    # Fijar minor tras primer pull (deuda documentada).
    image: wiremock/wiremock:3
    ports:
      - "7227:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dpkeys:
